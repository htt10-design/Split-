services:
  split:
    build: .
    container_name: split
    restart: unless-stopped
    env_file: .env
    volumes:
      - split-data:/data
    # Nur lokal erreichbar – von außen kommt man über den Tunnel/Proxy rein.
    ports:
      - "127.0.0.1:3000:3000"

  # Variante A: Cloudflare Tunnel (empfohlen, keine Portfreigabe nötig)
  # Aktivieren mit:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: split-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - split
    profiles: ["tunnel"]

volumes:
  split-data:
